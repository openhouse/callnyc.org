name: Launch evaluations

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  launch-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start archived application
        run: docker compose up -d --build

      - name: Wait for deterministic seed
        run: curl --retry 90 --retry-delay 2 --retry-all-errors --fail --silent --show-error http://127.0.0.1:8080/ > /dev/null

      - name: Run behavioral tests
        run: npm test

      - name: Score launch candidate
        run: npm run eval -- --url http://127.0.0.1:8080/

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
